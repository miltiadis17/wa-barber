<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Barbershop Admin</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>💈 Barbershop</h1>
                <p id="currentUser">Admin Panel</p>
            </div>

            <nav class="nav">
                <a href="dashboard.html" class="nav-item active">
                    <span class="nav-item-icon">📊</span>
                    Dashboard
                </a>
                <a href="bookings.html" class="nav-item">
                    <span class="nav-item-icon">📅</span>
                    Bookings
                </a>
                <a href="masters.html" class="nav-item">
                    <span class="nav-item-icon">👨‍🦱</span>
                    Masters
                </a>
                <a href="services.html" class="nav-item">
                    <span class="nav-item-icon">✂️</span>
                    Services
                </a>
            </nav>

            <div class="sidebar-footer">
                <button onclick="logout()" class="btn btn-secondary btn-block btn-sm">Logout</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h1>Dashboard</h1>
                <p>Overview of your barbershop bookings and statistics</p>
            </div>

            <div id="statsContainer" class="stats-grid">
                <!-- Stats will be loaded here -->
            </div>

            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Bookings by Service</h2>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Service</th>
                                <th>Bookings</th>
                            </tr>
                        </thead>
                        <tbody id="serviceStats"></tbody>
                    </table>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Bookings by Master</h2>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Master</th>
                                <th>Bookings</th>
                            </tr>
                        </thead>
                        <tbody id="masterStats"></tbody>
                    </table>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Busiest Hours</h2>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Hour</th>
                                <th>Bookings</th>
                            </tr>
                        </thead>
                        <tbody id="hourStats"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script>
        let currentUser = null;

        async function loadDashboard() {
            try {
                // Check auth
                currentUser = await API.checkAuth();
                document.getElementById('currentUser').textContent = `Welcome, ${currentUser.username}`;

                // Load stats
                const stats = await API.getStats();

                // Overview stats
                const statsHTML = `
                    <div class="stat-card">
                        <div class="stat-label">Total Bookings</div>
                        <div class="stat-value">${stats.overview.totalBookings}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Today's Bookings</div>
                        <div class="stat-value">${stats.overview.bookingsToday}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Upcoming Bookings</div>
                        <div class="stat-value">${stats.overview.upcomingBookings}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Active Masters</div>
                        <div class="stat-value">${stats.overview.totalMasters}</div>
                    </div>
                `;
                document.getElementById('statsContainer').innerHTML = statsHTML;

                // Service stats
                const serviceStatsHTML = stats.bookingsByService.map(s => `
                    <tr>
                        <td>${s.name}</td>
                        <td><strong>${s.count}</strong></td>
                    </tr>
                `).join('');
                document.getElementById('serviceStats').innerHTML = serviceStatsHTML || '<tr><td colspan="2">No data</td></tr>';

                // Master stats
                const masterStatsHTML = stats.bookingsByMaster.map(m => `
                    <tr>
                        <td>${m.name}</td>
                        <td><strong>${m.count}</strong></td>
                    </tr>
                `).join('');
                document.getElementById('masterStats').innerHTML = masterStatsHTML || '<tr><td colspan="2">No data</td></tr>';

                // Hour stats
                const hourStatsHTML = stats.busiestHours.map(h => `
                    <tr>
                        <td>${h.hour}</td>
                        <td><strong>${h.count}</strong></td>
                    </tr>
                `).join('');
                document.getElementById('hourStats').innerHTML = hourStatsHTML || '<tr><td colspan="2">No data</td></tr>';

            } catch (error) {
                console.error('Error loading dashboard:', error);
                alert('Failed to load dashboard data');
            }
        }

        async function logout() {
            await API.logout();
        }

        // Load on page load
        document.addEventListener('DOMContentLoaded', loadDashboard);
    </script>
</body>
</html>
