<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Barbershop Admin</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>💈 Barbershop</h1>
                <p id="currentUser">Admin Panel</p>
            </div>

            <nav class="nav">
                <a href="dashboard.html" class="nav-item active">
                    <span class="nav-item-icon">📊</span>
                    Dashboard
                </a>
                <a href="bookings.html" class="nav-item">
                    <span class="nav-item-icon">📅</span>
                    Bookings
                </a>
                <a href="calendar.html" class="nav-item">
                    <span class="nav-item-icon">🗓️</span>
                    Calendar
                </a>
                <a href="masters.html" class="nav-item">
                    <span class="nav-item-icon">👨‍🦱</span>
                    Masters
                </a>
                <a href="services.html" class="nav-item">
                    <span class="nav-item-icon">✂️</span>
                    Services
                </a>
            </nav>

            <div class="sidebar-footer">
                <button onclick="logout()" class="btn btn-secondary btn-block btn-sm">Logout</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h1>Dashboard</h1>
                <p>Overview of your barbershop bookings and statistics</p>
            </div>

            <div id="statsContainer" class="stats-grid">
                <!-- Stats cards will be loaded here -->
            </div>

            <!-- Bookings Trend Chart -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">📈 Bookings Trend</h2>
                    <p style="font-size: 14px; color: var(--text-secondary); margin: 0;">Last 14 days</p>
                </div>
                <div class="chart-container">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 24px;">
                <!-- Services Distribution Chart -->
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">🍰 Services Distribution</h2>
                    </div>
                    <div class="chart-container" style="height: 300px;">
                        <canvas id="servicesChart"></canvas>
                    </div>
                </div>

                <!-- Masters Performance Chart -->
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">👥 Masters Performance</h2>
                    </div>
                    <div class="chart-container" style="height: 300px;">
                        <canvas id="mastersChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Busiest Hours Chart -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">⏰ Busiest Hours</h2>
                    <p style="font-size: 14px; color: var(--text-secondary); margin: 0;">Last 30 days</p>
                </div>
                <div class="chart-container">
                    <canvas id="hoursChart"></canvas>
                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/charts.js"></script>
    <script>
        let currentUser = null;
        let charts = {};

        async function loadDashboard() {
            try {
                // Check auth
                currentUser = await API.checkAuth();
                document.getElementById('currentUser').textContent = `Welcome, ${currentUser.username}`;

                // Load stats
                const stats = await API.getStats();

                // Overview stats cards
                const statsHTML = `
                    <div class="stat-card">
                        <div class="stat-label">Total Bookings</div>
                        <div class="stat-value">${stats.overview.totalBookings}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Today's Bookings</div>
                        <div class="stat-value">${stats.overview.bookingsToday}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Upcoming Bookings</div>
                        <div class="stat-value">${stats.overview.upcomingBookings}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Active Masters</div>
                        <div class="stat-value">${stats.overview.totalMasters}</div>
                    </div>
                `;
                document.getElementById('statsContainer').innerHTML = statsHTML;

                // Initialize charts
                charts.trend = createTrendChart(stats.bookingsPerDay);
                charts.services = createServicesChart(stats.bookingsByService);
                charts.masters = createMastersChart(stats.bookingsByMaster);
                charts.hours = createHoursChart(stats.busiestHours);

            } catch (error) {
                console.error('Error loading dashboard:', error);
                alert('Failed to load dashboard data');
            }
        }

        async function logout() {
            await API.logout();
        }

        // Load on page load
        document.addEventListener('DOMContentLoaded', loadDashboard);
    </script>
</body>
</html>
