<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar - Barbershop Admin</title>
  <link rel="stylesheet" href="css/style.css">
  <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css' rel='stylesheet' />
  <style>
    .calendar-container {
      background: white;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e5e7eb;
    }

    .calendar-header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 600;
      color: var(--text-primary, #1f2937);
    }

    .filter-controls {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .filter-controls select {
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      background: white;
    }

    .filter-controls select:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .legend {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      padding: 15px;
      background: #f9fafb;
      border-radius: 8px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    .legend-color {
      width: 16px;
      height: 16px;
      border-radius: 4px;
    }

    #calendar {
      margin-top: 20px;
    }

    /* FullCalendar customization */
    .fc {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 14px;
    }

    .fc .fc-toolbar-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary, #1f2937);
    }

    .fc .fc-button-primary {
      background-color: var(--primary-color, #2563eb);
      border-color: var(--primary-color, #2563eb);
      font-weight: 500;
      text-transform: capitalize;
    }

    .fc .fc-button-primary:hover {
      background-color: var(--primary-hover, #1d4ed8);
      border-color: var(--primary-hover, #1d4ed8);
    }

    .fc .fc-button-primary:disabled {
      background-color: #93c5fd;
      border-color: #93c5fd;
      opacity: 0.6;
    }

    .fc .fc-button-primary:not(:disabled):active,
    .fc .fc-button-primary:not(:disabled).fc-button-active {
      background-color: var(--primary-hover, #1d4ed8);
      border-color: var(--primary-hover, #1d4ed8);
    }

    .fc-event {
      cursor: pointer;
      border-radius: 4px;
      padding: 2px 4px;
      font-size: 13px;
      font-weight: 500;
    }

    .fc-event:hover {
      opacity: 0.85;
    }

    .fc .fc-col-header-cell {
      background-color: #f9fafb;
      font-weight: 600;
      padding: 10px 0;
    }

    .fc .fc-daygrid-day-number {
      padding: 8px;
      font-weight: 500;
    }

    .fc .fc-timegrid-slot {
      height: 3em;
    }

    /* Modal styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      animation: fadeIn 0.2s;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      background-color: white;
      margin: 10% auto;
      padding: 30px;
      border-radius: 12px;
      max-width: 500px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      animation: slideIn 0.3s;
    }

    @keyframes slideIn {
      from {
        transform: translateY(-50px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary, #1f2937);
    }

    .close {
      font-size: 28px;
      font-weight: bold;
      color: var(--text-secondary, #6b7280);
      cursor: pointer;
      transition: color 0.2s;
      line-height: 1;
    }

    .close:hover {
      color: var(--text-primary, #1f2937);
    }

    .modal-body {
      line-height: 1.8;
    }

    .detail-row {
      display: flex;
      padding: 12px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-label {
      font-weight: 600;
      color: var(--text-secondary, #64748b);
      min-width: 120px;
    }

    .detail-value {
      color: var(--text-primary, #1f2937);
      flex: 1;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-confirmed {
      background-color: #d1fae5;
      color: var(--success-color, #16a34a);
    }

    .status-pending {
      background-color: #fef3c7;
      color: var(--warning-color, #ea580c);
    }

    .status-cancelled {
      background-color: #fee2e2;
      color: var(--danger-color, #dc2626);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #e5e7eb;
    }

    .modal-actions button {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-edit {
      background-color: var(--primary-color, #2563eb);
      color: white;
    }

    .btn-edit:hover {
      background-color: var(--primary-hover, #1d4ed8);
    }

    .btn-delete {
      background-color: var(--danger-color, #dc2626);
      color: white;
    }

    .btn-delete:hover {
      background-color: var(--danger-hover, #b91c1c);
    }

    .btn-save {
      background-color: var(--success-color, #16a34a);
      color: white;
    }

    .btn-save:hover {
      background-color: var(--success-hover, #15803d);
    }

    .btn-cancel {
      background-color: #e5e7eb;
      color: var(--text-primary, #1f2937);
    }

    .btn-cancel:hover {
      background-color: #d1d5db;
    }

    .edit-form {
      display: none;
    }

    .edit-form.active {
      display: block;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 14px;
      color: var(--text-primary, #1f2937);
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--primary-color, #2563eb);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .view-mode {
      display: block;
    }

    .view-mode.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>💈 Barbershop</h1>
        <p>Admin Panel</p>
      </div>

      <nav class="nav">
        <a href="dashboard.html" class="nav-item">
          <span class="nav-item-icon">📊</span>
          Dashboard
        </a>
        <a href="bookings.html" class="nav-item">
          <span class="nav-item-icon">📅</span>
          Bookings
        </a>
        <a href="calendar.html" class="nav-item active">
          <span class="nav-item-icon">🗓️</span>
          Calendar
        </a>
        <a href="masters.html" class="nav-item">
          <span class="nav-item-icon">👨‍🦱</span>
          Masters
        </a>
        <a href="services.html" class="nav-item">
          <span class="nav-item-icon">✂️</span>
          Services
        </a>
      </nav>

      <div class="sidebar-footer">
        <button onclick="logout()" class="btn btn-secondary btn-block btn-sm">Logout</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="calendar-container">
        <div class="calendar-header">
          <h1>📅 Calendar View</h1>
          <div class="filter-controls">
            <select id="masterFilter" onchange="filterByMaster()">
              <option value="">All Masters</option>
            </select>
          </div>
        </div>

        <div class="legend">
          <div class="legend-item">
            <div class="legend-color" style="background-color: #3B82F6;"></div>
            <span>John</span>
          </div>
          <div class="legend-item">
            <div class="legend-color" style="background-color: #10B981;"></div>
            <span>Andrew</span>
          </div>
          <div class="legend-item">
            <div class="legend-color" style="background-color: #F59E0B;"></div>
            <span>Paul</span>
          </div>
        </div>

        <div id="calendar"></div>
      </div>
    </main>
  </div>

  <!-- Booking Details Modal -->
  <div id="bookingModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Booking Details</h2>
        <span class="close" onclick="closeModal()">&times;</span>
      </div>
      <div class="modal-body">
        <!-- View Mode -->
        <div id="viewMode" class="view-mode">
          <div id="modalBody"></div>
          <div class="modal-actions">
            <button class="btn-edit" onclick="enterEditMode()">✏️ Edit</button>
            <button class="btn-delete" onclick="deleteBooking()">🗑️ Delete</button>
          </div>
        </div>

        <!-- Edit Mode -->
        <div id="editMode" class="edit-form">
          <form id="editForm">
            <div class="form-group">
              <label for="editService">Service</label>
              <select id="editService" required>
                <!-- Options loaded dynamically -->
              </select>
            </div>
            <div class="form-group">
              <label for="editMaster">Master</label>
              <select id="editMaster" required>
                <!-- Options loaded dynamically -->
              </select>
            </div>
            <div class="form-group">
              <label for="editDate">Date</label>
              <input type="date" id="editDate" required>
            </div>
            <div class="form-group">
              <label for="editTime">Time</label>
              <input type="time" id="editTime" required>
            </div>
            <div class="form-group">
              <label for="editStatus">Status</label>
              <select id="editStatus" required>
                <option value="confirmed">Confirmed</option>
                <option value="pending">Pending</option>
                <option value="cancelled">Cancelled</option>
              </select>
            </div>
            <div class="form-group">
              <label for="editClientName">Client Name</label>
              <input type="text" id="editClientName" placeholder="Optional">
            </div>
            <div class="modal-actions">
              <button type="submit" class="btn-save">💾 Save</button>
              <button type="button" class="btn-cancel" onclick="exitEditMode()">✖️ Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
  <script>
    let calendar;
    let currentMasterFilter = '';
    let currentBooking = null;
    let allServices = [];
    let allMasters = [];

    // Check authentication
    async function checkAuth() {
      try {
        const response = await fetch('/api/admin/auth/check');
        if (!response.ok) {
          window.location.href = '/admin/login.html';
        }
      } catch (error) {
        window.location.href = '/admin/login.html';
      }
    }

    // Logout
    async function logout() {
      try {
        await fetch('/api/admin/auth/logout', { method: 'POST' });
        window.location.href = '/admin/login.html';
      } catch (error) {
        console.error('Logout error:', error);
      }
    }

    // Load masters for filter
    async function loadMasters() {
      try {
        const response = await fetch('/api/admin/masters');
        allMasters = await response.json();

        const select = document.getElementById('masterFilter');
        allMasters.forEach(master => {
          const option = document.createElement('option');
          option.value = master.id;
          option.textContent = master.name;
          select.appendChild(option);
        });
      } catch (error) {
        console.error('Error loading masters:', error);
      }
    }

    // Load services
    async function loadServices() {
      try {
        const response = await fetch('/api/admin/services');
        allServices = await response.json();
      } catch (error) {
        console.error('Error loading services:', error);
      }
    }

    // Populate edit form selects
    function populateEditForm() {
      // Populate services
      const serviceSelect = document.getElementById('editService');
      serviceSelect.innerHTML = '';
      allServices.forEach(service => {
        const option = document.createElement('option');
        option.value = service.id;
        option.textContent = `${service.name} (${service.duration_minutes} min)`;
        serviceSelect.appendChild(option);
      });

      // Populate masters
      const masterSelect = document.getElementById('editMaster');
      masterSelect.innerHTML = '';
      allMasters.forEach(master => {
        const option = document.createElement('option');
        option.value = master.id;
        option.textContent = master.name;
        masterSelect.appendChild(option);
      });
    }

    // Filter by master
    function filterByMaster() {
      const select = document.getElementById('masterFilter');
      currentMasterFilter = select.value;
      calendar.refetchEvents();
    }

    // Format date for display
    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString('en-US', {
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });
    }

    // Format time for display
    function formatTime(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleTimeString('en-US', {
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    // Show booking details modal
    function showBookingDetails(event) {
      const props = event.extendedProps;

      // Store current booking data
      currentBooking = {
        id: event.id,
        start: event.start,
        end: event.end,
        ...props
      };

      const statusClass = `status-${props.status}`;

      const html = `
        <div class="detail-row">
          <div class="detail-label">Service:</div>
          <div class="detail-value">${props.service_name}</div>
        </div>
        <div class="detail-row">
          <div class="detail-label">Master:</div>
          <div class="detail-value">${props.master_name}</div>
        </div>
        <div class="detail-row">
          <div class="detail-label">Client:</div>
          <div class="detail-value">${props.client_name || props.client_phone}</div>
        </div>
        <div class="detail-row">
          <div class="detail-label">Phone:</div>
          <div class="detail-value">${props.client_phone}</div>
        </div>
        <div class="detail-row">
          <div class="detail-label">Date:</div>
          <div class="detail-value">${formatDate(event.start)}</div>
        </div>
        <div class="detail-row">
          <div class="detail-label">Time:</div>
          <div class="detail-value">${formatTime(event.start)} - ${formatTime(event.end)}</div>
        </div>
        <div class="detail-row">
          <div class="detail-label">Duration:</div>
          <div class="detail-value">${props.duration} minutes</div>
        </div>
        <div class="detail-row">
          <div class="detail-label">Status:</div>
          <div class="detail-value">
            <span class="status-badge ${statusClass}">${props.status}</span>
          </div>
        </div>
      `;

      document.getElementById('modalBody').innerHTML = html;

      // Reset to view mode
      document.getElementById('viewMode').classList.remove('hidden');
      document.getElementById('editMode').classList.remove('active');
      document.getElementById('modalTitle').textContent = 'Booking Details';

      document.getElementById('bookingModal').style.display = 'block';
    }

    // Enter edit mode
    function enterEditMode() {
      if (!currentBooking) return;

      populateEditForm();

      // Find service ID and master ID from names
      const service = allServices.find(s => s.name === currentBooking.service_name);
      const master = allMasters.find(m => m.name === currentBooking.master_name);

      // Fill form
      document.getElementById('editService').value = service ? service.id : '';
      document.getElementById('editMaster').value = master ? master.id : '';

      const dateStr = currentBooking.start.toISOString().split('T')[0];
      const timeStr = currentBooking.start.toTimeString().substring(0, 5);

      document.getElementById('editDate').value = dateStr;
      document.getElementById('editTime').value = timeStr;
      document.getElementById('editStatus').value = currentBooking.status;
      document.getElementById('editClientName').value = currentBooking.client_name || '';

      // Switch to edit mode
      document.getElementById('viewMode').classList.add('hidden');
      document.getElementById('editMode').classList.add('active');
      document.getElementById('modalTitle').textContent = 'Edit Booking';
    }

    // Exit edit mode
    function exitEditMode() {
      document.getElementById('viewMode').classList.remove('hidden');
      document.getElementById('editMode').classList.remove('active');
      document.getElementById('modalTitle').textContent = 'Booking Details';
    }

    // Save booking changes
    document.getElementById('editForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const formData = {
        service_id: parseInt(document.getElementById('editService').value),
        master_id: parseInt(document.getElementById('editMaster').value),
        booking_date: document.getElementById('editDate').value,
        booking_time: document.getElementById('editTime').value + ':00',
        status: document.getElementById('editStatus').value,
        client_name: document.getElementById('editClientName').value || null
      };

      try {
        const response = await fetch(`/api/admin/bookings/${currentBooking.id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        });

        if (!response.ok) {
          const error = await response.json();
          alert(error.error || 'Failed to update booking');
          return;
        }

        // Success - refresh calendar and close modal
        calendar.refetchEvents();
        closeModal();
        alert('Booking updated successfully!');
      } catch (error) {
        console.error('Error updating booking:', error);
        alert('Failed to update booking');
      }
    });

    // Delete booking
    async function deleteBooking() {
      if (!currentBooking) return;

      if (!confirm('Are you sure you want to cancel this booking?')) {
        return;
      }

      try {
        const response = await fetch(`/api/admin/bookings/${currentBooking.id}`, {
          method: 'DELETE'
        });

        if (!response.ok) {
          alert('Failed to cancel booking');
          return;
        }

        // Success - refresh calendar and close modal
        calendar.refetchEvents();
        closeModal();
        alert('Booking cancelled successfully!');
      } catch (error) {
        console.error('Error cancelling booking:', error);
        alert('Failed to cancel booking');
      }
    }

    // Close modal
    function closeModal() {
      document.getElementById('bookingModal').style.display = 'none';
      exitEditMode();
      currentBooking = null;
    }

    // Close modal when clicking outside
    window.onclick = function(event) {
      const modal = document.getElementById('bookingModal');
      if (event.target === modal) {
        closeModal();
      }
    }

    // Initialize calendar
    function initCalendar() {
      const calendarEl = document.getElementById('calendar');

      calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'timeGridWeek',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },
        slotMinTime: '12:00:00',
        slotMaxTime: '20:00:00',
        slotDuration: '00:30:00',
        allDaySlot: false,
        height: 'auto',
        weekends: true,
        nowIndicator: true,
        editable: true,
        eventStartEditable: true,
        eventDurationEditable: false,
        eventTimeFormat: {
          hour: '2-digit',
          minute: '2-digit',
          hour12: false
        },
        events: function(info, successCallback, failureCallback) {
          const params = new URLSearchParams({
            start: info.startStr.split('T')[0],
            end: info.endStr.split('T')[0]
          });

          if (currentMasterFilter) {
            params.append('master_id', currentMasterFilter);
          }

          fetch(`/api/admin/bookings/calendar/events?${params}`)
            .then(response => response.json())
            .then(data => successCallback(data))
            .catch(error => {
              console.error('Error loading events:', error);
              failureCallback(error);
            });
        },
        eventClick: function(info) {
          showBookingDetails(info.event);
        },
        eventDidMount: function(info) {
          // Add tooltip
          info.el.title = `${info.event.extendedProps.service_name} - ${info.event.extendedProps.master_name}`;
        },
        eventDrop: async function(info) {
          // Handle drag & drop
          const event = info.event;

          const newDate = event.start.toISOString().split('T')[0];
          const newTime = event.start.toTimeString().substring(0, 8);

          try {
            const response = await fetch(`/api/admin/bookings/${event.id}`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                booking_date: newDate,
                booking_time: newTime
              })
            });

            if (!response.ok) {
              const error = await response.json();
              alert(error.error || 'Failed to move booking');
              info.revert();
              return;
            }

            alert('Booking moved successfully!');
          } catch (error) {
            console.error('Error moving booking:', error);
            alert('Failed to move booking');
            info.revert();
          }
        }
      });

      calendar.render();
    }

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', async function() {
      checkAuth();
      await loadMasters();
      await loadServices();
      initCalendar();
    });
  </script>
</body>
</html>
